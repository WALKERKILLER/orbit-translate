name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python -m compileall -q orbit_translate orbit-translate.py tests

      # GTK popup tests skip here (no PyGObject); the arch job runs them.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  arch:
    name: test (arch, system gtk)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install runtime
        run: pacman -Syu --noconfirm --needed python python-gobject gtk3 gtk-layer-shell wl-clipboard git

      - name: Checkout repository
        uses: actions/checkout@v7

      # install.sh refuses root, so the suite runs as a regular user.
      - name: Unit tests (system python, GTK3 + GtkLayerShell)
        run: |
          useradd --create-home tester
          chown -R tester: "$GITHUB_WORKSPACE"
          su tester -c "cd '$GITHUB_WORKSPACE' && PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 -m unittest discover -s tests -t . -v"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck install.sh

      - name: Docs gate
        run: python3 -m unittest tests.test_docs -v

      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
